services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solen_password}
      POSTGRES_DB: ${POSTGRES_DB:-solen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
